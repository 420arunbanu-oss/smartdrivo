name: Build SmartDrivo Admin Android (private testing)

on:
  workflow_dispatch:

jobs:
  admin-debug-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate wrapper (current project standard)
        run: gradle wrapper --gradle-version 9.3.1
      - name: Restore separate Admin Firebase configuration
        env:
          ADMIN_FIREBASE_JSON_BASE64: ${{ secrets.ADMIN_FIREBASE_JSON_BASE64 }}
        run: |
          test -n "$ADMIN_FIREBASE_JSON_BASE64" || { echo 'Missing ADMIN_FIREBASE_JSON_BASE64 secret'; exit 1; }
          printf '%s' "$ADMIN_FIREBASE_JSON_BASE64" | base64 -d > admin-android/app/google-services.json
      - name: Verify distinct admin package
        run: |
          grep -F 'applicationId = "com.smartdrivo.admin"' admin-android/app/build.gradle.kts
          ! grep -F 'applicationId = "com.smartdrivo.app"' admin-android/app/build.gradle.kts
      - name: Test and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew -p admin-android :app:testDebugUnitTest :app:assembleDebug --no-configuration-cache
      - name: Upload internal testing APK (not a production release)
        uses: actions/upload-artifact@v4
        with:
          name: SmartDrivo-Admin-v1.0.0-Internal-Test
          path: admin-android/app/build/outputs/apk/debug/app-debug.apk
