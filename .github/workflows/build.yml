name: Build SmartDrivo APK

on:
  push:
    branches: [ main, smartdrivo-device-lock-free-20261011-112401 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-configuration-cache

      - name: Prepare Final APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "SmartDrivo-Debug.apk"
          test -f "SmartDrivo-Debug.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartDrivo-Debug-APK
          path: SmartDrivo-Debug.apk
